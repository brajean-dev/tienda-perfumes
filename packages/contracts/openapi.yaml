openapi: 3.1.0
info:
  title: API de la tienda de perfumes
  version: 0.1.0
  description: >-
    Contrato de la API. Se actualiza en el mismo cambio que cada endpoint
    (ver docs/decisions/0003-openapi-fuente-del-contrato.md).
servers:
  - url: http://localhost:3000
    description: Desarrollo local
tags:
  - name: Health
    description: Disponibilidad de la API
paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Comprueba que la API está disponible
      description: >-
        Indica que el proceso de la API responde. No consulta la base de datos.
      responses:
        '200':
          description: La API está disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
components:
  schemas:
    HealthResponse:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok]
